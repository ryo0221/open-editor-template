name: Verify idea comparison Editor

on:
  push:
    branches: [main, 'dogfood/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    # Pin an OS with supported Playwright browser system dependencies.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node scripts/vendor-isolation.mjs
      - run: npm test
      - run: npm run build
      - run: npm run verify:package
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --workers=2 --retries=0 --reporter=list,html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: idea-comparison-editor-verification
          path: |
            playwright-report/
            test-results/
            dist/paobub/host-pin.json
          retention-days: 7
