name: Verify editor template

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    # Pin an OS with supported Playwright browser system dependencies.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node scripts/vendor-isolation.mjs
      - run: npm test
      - run: npm run build
      - run: npm run verify:package
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
